[package]
name = "mt5_session"
version = "0.1.0"
edition = "2024"

# The socket for the mt5-native codec.
#
# It lives in its own crate so the codec keeps the property that makes it safe
# to reason about: no networking, anywhere in it. A frame builder that cannot
# reach a socket cannot place an order by accident.

[dependencies]
mt5_native = { path = "../mt5-native" }
# OS-backed nonce generation is used only by the opt-in socket transport.
rand = { version = "0.8", optional = true }

[features]
# Nothing here connects to anything unless this is on, and the codec's own
# tripwire has to be satisfied as well.
live = ["mt5_native/live", "dep:rand"]

# The probe opens a socket, so it only builds under `live`; without the feature
# the default build skips it instead of failing to resolve Session.
[[example]]
name = "auth_probe"
required-features = ["live"]
