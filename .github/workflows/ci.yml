name: Rust CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source snapshot
        run: git archive HEAD --format=tar --output=/tmp/review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/review-source.tar
          retention-days: 1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Test all crates and features
        run: cargo +stable test --workspace --all-features --locked
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked
